name: iOS Release Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preflight the staged bundle against Nexus without uploading"
        required: true
        default: true
        type: boolean
      build_only:
        description: "Only build and stage the release bundle artifact"
        required: true
        default: false
        type: boolean
      cmake_config:
        description: "CMake/Xcode configuration"
        required: true
        default: "RelWithDebInfo"
        type: choice
        options:
          - RelWithDebInfo
          - Release
          - Debug
      cmake_extra_args:
        description: "Optional extra CMake configure args, one per line"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build staged release bundle
    runs-on: macos-26
    timeout-minutes: 240
    outputs:
      release_version: ${{ steps.stage.outputs.release_version }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          submodules: false

      - name: Validate release mode
        shell: bash
        env:
          BUILD_ONLY_INPUT: ${{ inputs.build_only }}
          CMAKE_CONFIG_INPUT: ${{ inputs.cmake_config }}
          CMAKE_EXTRA_ARGS_INPUT: ${{ inputs.cmake_extra_args }}
        run: |
          set -euo pipefail
          if [ "${BUILD_ONLY_INPUT}" != "true" ]; then
            [ "${GITHUB_REF}" = "refs/heads/main" ] || {
              echo "Nexus dry runs and publication are restricted to main" >&2
              exit 1
            }
            [ "${CMAKE_CONFIG_INPUT}" = "RelWithDebInfo" ] || {
              echo "Nexus publication requires RelWithDebInfo" >&2
              exit 1
            }
            [ -z "${CMAKE_EXTRA_ARGS_INPUT}" ] || {
              echo "Nexus publication does not accept variant CMake arguments" >&2
              exit 1
            }
          fi

      - name: Sync submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          for attempt in 1 2 3 4 5 6; do
            if git submodule update --init --recursive --jobs 1; then
              exit 0
            fi
            if [ "${attempt}" -eq 6 ]; then
              echo "recursive submodule checkout failed after ${attempt} attempts" >&2
              exit 1
            fi
            delay=$((attempt * 10))
            echo "submodule checkout attempt ${attempt} failed; retrying in ${delay}s" >&2
            sleep "${delay}"
          done

      - name: Select Xcode 26.3
        shell: bash
        run: |
          set -euo pipefail
          test -d "${DEVELOPER_DIR}"
          sudo xcode-select -s "${DEVELOPER_DIR}"
          xcodebuild -version

      - name: Install and check source build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install nasm yasm doxygen
          python3 -m venv "${RUNNER_TEMP}/linphone-release-venv"
          "${RUNNER_TEMP}/linphone-release-venv/bin/pip" install pystache six
          echo "${RUNNER_TEMP}/linphone-release-venv/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/linphone-release-venv/bin/python" - <<'PY'
          import pystache  # noqa: F401
          import six  # noqa: F401
          PY
          for cmd in cmake curl git nasm yasm doxygen python3 shasum unzip zip xcodebuild; do
            command -v "$cmd" >/dev/null 2>&1 || {
              echo "missing command: $cmd" >&2
              exit 1
            }
          done

      - name: Build and stage release bundle
        id: stage
        shell: bash
        env:
          CMAKE_CONFIG_INPUT: ${{ inputs.cmake_config }}
          CMAKE_EXTRA_ARGS_INPUT: ${{ inputs.cmake_extra_args }}
        run: |
          set -euo pipefail
          chmod +x scripts/ios-release-publish.sh
          args=(
            --build-only
            --build-dir "${GITHUB_WORKSPACE}/build-ios-release"
            --staging-dir "${GITHUB_WORKSPACE}/out/ios-release"
            --cmake-config "${CMAKE_CONFIG_INPUT}"
            --nexus-base-url "https://nexus.tools.textnow.io"
            --nexus-repository "ios-release"
          )
          while IFS= read -r extra_arg; do
            [ -n "${extra_arg}" ] || continue
            args+=(--cmake-extra-arg "${extra_arg}")
          done <<< "${CMAKE_EXTRA_ARGS_INPUT}"
          scripts/ios-release-publish.sh "${args[@]}"

      - name: Upload staged release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-release-staged-${{ steps.stage.outputs.release_version || github.run_id }}
          path: out/ios-release
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  publish:
    name: Publish staged release bundle
    needs: build
    if: ${{ inputs.build_only != true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ios-release-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          submodules: false

      - name: Download staged release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ios-release-staged-${{ needs.build.outputs.release_version || github.run_id }}
          path: staged-release

      - name: Locate staged release bundle
        id: staged
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${GITHUB_WORKSPACE}/staged-release/release-manifest.txt" ]; then
            echo "staging_dir=${GITHUB_WORKSPACE}/staged-release" >> "${GITHUB_OUTPUT}"
          elif [ -f "${GITHUB_WORKSPACE}/staged-release/ios-release/release-manifest.txt" ]; then
            echo "staging_dir=${GITHUB_WORKSPACE}/staged-release/ios-release" >> "${GITHUB_OUTPUT}"
          else
            echo "staged release manifest not found after artifact download" >&2
            exit 1
          fi

      - name: Check publish prerequisites
        shell: bash
        run: |
          set -euo pipefail
          for cmd in bash curl shasum unzip; do
            command -v "$cmd" >/dev/null 2>&1 || {
              echo "missing command: $cmd" >&2
              exit 1
            }
          done

      - name: Publish or dry-run staged bundle
        id: publish
        shell: bash
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          NEXUS_CAPI_USER: ${{ secrets.NEXUS_CAPI_USER }}
          NEXUS_CAPI_PASSWORD: ${{ secrets.NEXUS_CAPI_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x scripts/ios-release-publish.sh
          args=(
            --publish-staged
            --staging-dir "${{ steps.staged.outputs.staging_dir }}"
            --nexus-base-url "https://nexus.tools.textnow.io"
            --nexus-repository "ios-release"
          )
          if [ "${DRY_RUN_INPUT}" = "true" ]; then
            args+=(--dry-run)
          fi
          scripts/ios-release-publish.sh "${args[@]}"

      - name: Upload source package bundle artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linphone-swiftpm-source-${{ steps.publish.outputs.release_version || github.run_id }}
          path: |
            ${{ steps.staged.outputs.staging_dir }}/source-bundle
            ${{ steps.staged.outputs.staging_dir }}/${{ steps.publish.outputs.source_bundle_zip }}
            ${{ steps.staged.outputs.staging_dir }}/release-manifest.txt
          if-no-files-found: warn
          overwrite: false
          retention-days: 30
