name: iOS Swift package

on:
  pull_request:
    paths:
      - Package.swift
      - Sources/linphonesw/**
      - .github/workflows/ios-swift-package.yml
  push:
    branches:
      - ios-spm
    paths:
      - Package.swift
      - Sources/linphonesw/**
      - .github/workflows/ios-swift-package.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - name: Check out package
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate package manifest
        run: swift package dump-package
